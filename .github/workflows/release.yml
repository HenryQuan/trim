name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y --no-progress
        shell: bash

      - name: Build
        run: |
          case "${{ runner.os }}" in
            Linux)   out="trim-linux"   ;;
            macOS)   out="trim-macos"   ;;
            Windows) out="trim-windows.exe" ;;
          esac
          gcc -O2 -s -o "$out" src/main.c src/util.c src/exec.c src/compact.c src/read.c
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: trim-${{ runner.os }}
          path: trim-*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: trim-*
          merge-multiple: true

      - name: Create draft release
        run: |
          gh release create "${{ github.event.inputs.tag }}" \
            --draft --generate-notes \
            trim-linux trim-macos trim-windows.exe
        env:
          GH_TOKEN: ${{ github.token }}
